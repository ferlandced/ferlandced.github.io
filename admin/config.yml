# Decap CMS config. Served at https://matteougolini.net/ced/admin/
backend:
  name: turbo-github
  turbo_site_id: 22f1b961-cfd9-45c3-9abf-f120a44b4ac5
  branch: main
  # No `repo`: Turbo uses the repo set in the Turbo dashboard.

# Uploads are committed to /images/uploads. public_folder has no /ced prefix:
# the Eleventy build adds pathPrefix to every URL in the generated HTML.
media_folder: images/uploads
public_folder: /images/uploads

# Header + login logo. `logo` supersedes the deprecated `logo_url`; only `logo` can show in the header.
logo:
  src: /ced/images/logo.svg
  show_in_header: true
site_url: https://matteougolini.net/ced/
display_url: https://matteougolini.net/ced/

collections:
  # Home page images (read by index.njk as `home`). Text lives in _data/i18n.json.
  - name: home
    label: Home page
    files:
      - name: hero
        label: Hero
        file: content/home.json
        format: json
        fields:
          - { name: signature, label: "Signature", widget: image, hint: "Agent mark (house + signature). SVG preferred, trimmed tight to the drawing." }
          - { name: hero_photo, label: "Agent photo", widget: image, hint: "Clipped photo with a transparent background, portrait, at least 1200 px tall. Also used in the About section." }
          - { name: hero_photo_alt, label: "Agent photo description", widget: string, required: false }
          - { name: side_image, label: "Hero image", widget: image, required: false, hint: "Full-screen background of the hero on every device. Landscape, at least 1920 px wide, usage rights confirmed." }
          - { name: side_image_alt, label: "Hero image description", widget: string, required: false, hint: "Leave empty if the image is decorative." }
          - { name: about_backdrop, label: "About backdrop", widget: image, required: false, hint: "Phones only: the scene behind the agent photo in the About section. Portrait, 9:16. Empty shows a plain gray panel." }
          - { name: contact_photo, label: "Contact page photo", widget: image, required: false, hint: "Agent picture on the Contact page. Portrait, 9:16. Empty shows a plain gray panel." }
          - { name: contact_photo_alt, label: "Contact page photo description", widget: string, required: false }

  # Header menu (read by header.njk as `menu`). Each item: a French and English label and URL.
  - name: menu
    label: Menu
    files:
      - name: menu
        label: "Menu du haut"
        file: content/menu.json
        format: json
        fields:
          - name: items
            label: "Liens du menu"
            label_singular: "Lien"
            widget: list
            max: 6
            hint: "Glissez les liens pour changer leur ordre. Au-delà de 4 ou 5 liens, le menu devient trop large sur ordinateur."
            summary: "{{fields.label.fr}}"
            fields:
              - name: label
                label: "Texte du lien"
                widget: object
                collapsed: false
                fields:
                  - { name: fr, label: "Français", widget: string }
                  - { name: en, label: "English", widget: string }
              - name: url
                label: "Adresse du lien"
                widget: object
                collapsed: false
                hint: "Une section de l'accueil (/fr/#about, /en/#services), une page du site (/fr/vendre/, /en/sell/) ou une page du site de REMAX (https://www.remax.ca/...)."
                fields:
                  - { name: fr, label: "Français", widget: string, pattern: ['^/(?![/\\])[^\s\\]*$|^https://(www\.)?remax\.(ca|com)/[^\s\\]*$', 'Une adresse du site (/fr/...) ou du site de REMAX (https://www.remax.ca/...)'] }
                  - { name: en, label: "English", widget: string, pattern: ['^/(?![/\\])[^\s\\]*$|^https://(www\.)?remax\.(ca|com)/[^\s\\]*$', 'An address on this site (/en/...) or the REMAX website (https://www.remax.ca/...)'] }

