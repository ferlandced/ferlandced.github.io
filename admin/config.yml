# Decap CMS config. Served at https://matteougolini.net/ced/admin/
backend:
  name: turbo-github
  turbo_site_id: 22f1b961-cfd9-45c3-9abf-f120a44b4ac5
  branch: main
  # No `repo`: Turbo uses the repo set in the Turbo dashboard.

# Uploads are committed to /images/uploads. public_folder has no /ced prefix:
# the Eleventy build adds pathPrefix to every URL in the generated HTML.
media_folder: images/uploads
public_folder: /images/uploads

# Header + login logo. `logo` supersedes the deprecated `logo_url`; only `logo` can show in the header.
logo:
  src: /ced/images/logo.svg
  show_in_header: true
site_url: https://matteougolini.net/ced/
display_url: https://matteougolini.net/ced/

# Editors see French labels. Every text has a French and an English version, side by side,
# stored in the file of the page or part where it appears (lib/content.ts, COPY_FILES).
# Keys are fixed here, so editors can change the wording but not the structure.
collections:
  # One file per page (content/pages/). URLs are fixed in _data/site.json (pages).
  - name: pages
    label: "Pages"
    description: "Une fiche par page du site. Chaque texte a une version française et une version anglaise."
    files:
      - name: home
        label: "Accueil"
        file: content/pages/home.json
        format: json
        description: "Les sections de la page d'accueil, de haut en bas."
        fields:
          - name: hero
            label: "1. Bandeau du haut"
            widget: object
            collapsed: true
            fields:
              - { name: photo, label: "Photo du courtier", widget: image, hint: "Photo détourée (fond transparent), en hauteur, au moins 1200 px de haut. Aussi utilisée dans la section À propos." }
              - { name: photoAlt, label: "Description de la photo du courtier", widget: string, required: false, hint: "Pour les lecteurs d'écran." }
              - { name: signature, label: "Signature", widget: image, hint: "Marque du courtier (maison + signature). SVG de préférence, rogné au plus près du dessin." }
              - { name: background, label: "Image de fond", widget: image, required: false, hint: "Plein écran derrière le bandeau, sur tous les appareils. Paysage, au moins 1920 px de large, droits d'utilisation confirmés." }
              - { name: backgroundAlt, label: "Description de l'image de fond", widget: string, required: false, hint: "Laissez vide si l'image est décorative." }
              - { name: tagline, label: "Slogan", widget: object, collapsed: false, hint: "**mots** en gras, _mots_ plus petits et légers, retour à la ligne là où le texte doit passer à la ligne (même coupure sur téléphone et ordinateur).", fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
              - { name: button, label: "Bouton : ouvre les options de contact", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: about
            label: "2. À propos"
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: "Titre de la section", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: storyPart1, label: "Histoire, partie 1 (la photo de paramédic apparaît)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
              - { name: storyPart2, label: "Histoire, partie 2 (la photo du courtier revient, puis le lien et les coordonnées)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
              - { name: storyLink, label: "Lien vers la page Mon histoire", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: cellLabel, label: "Texte devant le numéro de cellulaire", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: paramedicPhoto, label: "Photo de paramédic", widget: image, required: false, hint: "Remplace la photo du courtier pendant la partie 1 de l'histoire. Même taille et même cadrage que la photo du courtier (fond transparent), pour que les deux se superposent." }
              - { name: phoneBackdrop, label: "Fond derrière la photo (téléphones)", widget: image, required: false, hint: "Téléphones seulement : la scène derrière la photo du courtier. En hauteur, 9:16. Vide : pas de fond." }
          - name: services
            label: "3. Services"
            widget: object
            collapsed: true
            fields:
              - { name: heading, label: "Titre de la section", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - name: search
                label: "Chercher une propriété (achat ou location)"
                widget: object
                collapsed: false
                fields:
                  - { name: image, label: "Image", widget: image, required: false, hint: "Paysage, environ 1600 px de large, coupée en diagonale sur le site. Droits d'utilisation confirmés." }
                  - { name: imageAlt, label: "Description de l'image", widget: string, required: false, hint: "Laissez vide si l'image est décorative." }
                  - { name: title, label: "Titre", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: text, label: "Texte", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
                  - { name: buyLink, label: "Lien vers la page Acheter", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: rentLink, label: "Lien vers la page Louer", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: button, label: "Bouton : ouvre l'alerte immobilière (le formulaire demande achat ou location)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - name: sell
                label: "Vendre"
                widget: object
                collapsed: false
                fields:
                  - { name: image, label: "Image", widget: image, required: false, hint: "Paysage, environ 1600 px de large, coupée en diagonale sur le site. Droits d'utilisation confirmés." }
                  - { name: imageAlt, label: "Description de l'image", widget: string, required: false, hint: "Laissez vide si l'image est décorative." }
                  - { name: title, label: "Titre", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: text, label: "Texte", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
                  - { name: sellLink, label: "Lien vers la page Vendre", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: button, label: "Bouton : ouvre le formulaire d'estimation", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: properties
            label: "4. Mes propriétés"
            widget: object
            collapsed: true
            hint: "Les propriétés elles-mêmes viennent du site de REMAX. Les textes des cartes sont dans la page Propriétés."
            fields:
              - { name: heading, label: "Titre de la section", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: allButton, label: "Bouton vers la page de toutes les propriétés (affiché à partir de 7 propriétés)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
      - name: contact
        label: "Contact"
        file: content/pages/contact.json
        format: json
        description: "La page Contact et la fenêtre « Me contacter » de l'accueil : la même liste d'options."
        fields:
          - { name: title, label: "Titre de la page et de la fenêtre", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: photo, label: "Photo", widget: image, required: false, hint: "Photo du courtier sur la page Contact. En hauteur, 9:16. Vide : un panneau gris uni." }
          - { name: photoAlt, label: "Description de la photo", widget: string, required: false }
          - { name: closeButton, label: "Bouton X qui ferme la fenêtre, lu par les lecteurs d'écran", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: options
            label: "Options de contact"
            widget: object
            collapsed: false
            fields:
              - { name: call, label: "Option : appeler", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: copy, label: "Bouton qui copie le numéro (ordinateur)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: copied, label: "Message une fois le numéro copié", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: write, label: "Option : écrire", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: estimate, label: "Option : estimation", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: alert, label: "Option : alerte immobilière", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: findRental, label: "Option : trouver un logement", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: postRental, label: "Option : mettre en location", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
      - name: properties
        label: "Propriétés"
        file: content/pages/properties.json
        format: json
        description: "La page de toutes les propriétés et les cartes de propriété (aussi sur l'accueil)."
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: empty, label: "Texte quand il n'y a aucune propriété", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: cards
            label: "Cartes de propriété"
            widget: object
            collapsed: false
            fields:
              - { name: number, label: "Libellé du numéro d'inscription", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: bedrooms, label: "Chambres, lu par les lecteurs d'écran", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: bathrooms, label: "Salles de bain, lu par les lecteurs d'écran", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: powderRooms, label: "Salles d'eau, lu par les lecteurs d'écran", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: area, label: "Superficie habitable, lu par les lecteurs d'écran", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - name: status
                label: "Étiquette de statut"
                widget: object
                collapsed: false
                fields:
                  - { name: new, label: "Nouvelle inscription", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: sold, label: "Vendue", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: moreInfo, label: "Bouton : demander plus d'infos", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: newTab, label: "Ajouté au lien de la propriété : il s'ouvre dans un nouvel onglet", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
      - name: about
        label: "Mon histoire"
        file: content/pages/about.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }
      - name: buy
        label: "Acheter"
        file: content/pages/buy.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }
      - name: sell
        label: "Vendre"
        file: content/pages/sell.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }
      - name: rent
        label: "Louer"
        file: content/pages/rent.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }
      - name: privacy
        label: "Politique de confidentialité"
        file: content/pages/privacy.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: reviewPending, label: "En attente de révision juridique (affiche le bandeau en haut et en bas)", widget: boolean, default: true }
          - name: draftBanner
            label: "Bandeau d'ébauche (en haut et en bas, tant que la révision est en attente)"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre du bandeau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: text, label: "Texte du bandeau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: updatedLabel, label: "Texte devant la date de mise à jour", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: updated, label: "Date de mise à jour", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }
      - name: terms
        label: "Conditions d'utilisation"
        file: content/pages/terms.json
        format: json
        fields:
          - { name: title, label: "Titre de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: description, label: "Description pour les moteurs de recherche (une phrase)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: reviewPending, label: "En attente de révision juridique (affiche le bandeau en haut et en bas)", widget: boolean, default: true }
          - name: draftBanner
            label: "Bandeau d'ébauche (en haut et en bas, tant que la révision est en attente)"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre du bandeau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: text, label: "Texte du bandeau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: text }, { name: en, label: "English", widget: text }] }
          - { name: updatedLabel, label: "Texte devant la date de mise à jour", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: updated, label: "Date de mise à jour", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - { name: body, label: "Texte de la page", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: markdown }, { name: en, label: "English", widget: markdown }] }

  # Header menu and the header's other texts (content/menu.json).
  - name: menu
    label: "Menu"
    files:
      - name: menu
        label: "Menu du haut"
        file: content/menu.json
        format: json
        fields:
          - name: items
            label: "Liens du menu"
            label_singular: "Lien"
            widget: list
            max: 6
            hint: "Glissez les liens pour changer leur ordre. Au-delà de 4 ou 5 liens, le menu devient trop large sur ordinateur."
            summary: "{{fields.label.fr}}"
            fields:
              - { name: label, label: "Texte du lien", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - name: url
                label: "Adresse du lien"
                widget: object
                collapsed: false
                hint: "Une section de l'accueil (/fr/#about, /en/#services), une page du site (/fr/vendre/, /en/sell/) ou une page du site de REMAX (https://www.remax.ca/...)."
                fields:
                  - { name: fr, label: "Français", widget: string, pattern: ['^/(?![/\\])[^\s\\]*$|^https://(www\.)?remax\.(ca|com)/[^\s\\]*$', 'Une adresse du site (/fr/...) ou du site de REMAX (https://www.remax.ca/...)'] }
                  - { name: en, label: "English", widget: string, pattern: ['^/(?![/\\])[^\s\\]*$|^https://(www\.)?remax\.(ca|com)/[^\s\\]*$', 'An address on this site (/en/...) or the REMAX website (https://www.remax.ca/...)'] }
          - name: nav
            label: "Bouton du menu (lu par les lecteurs d'écran)"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: "Nom du menu principal", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: home, label: "Nom de la page d'accueil, sur le logo", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: open, label: "Bouton du menu mobile (fermé)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: close, label: "Bouton du menu mobile (ouvert)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: langSwitch
            label: "Changement de langue"
            widget: object
            collapsed: true
            hint: "Le nom de l'autre langue, affiché dans le haut de page."
            fields:
              - { name: fr, label: "Nom du français", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: en, label: "Nom de l'anglais", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: contactIcons
            label: "Icônes de contact (lues par les lecteurs d'écran)"
            widget: object
            collapsed: true
            fields:
              - { name: label, label: "Nom de la rangée d'icônes", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: phone, label: "Icône téléphone, lue avant le numéro", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: email, label: "Icône courriel, lue avant l'adresse", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: newTab, label: "Ajouté après Instagram et Facebook : le lien s'ouvre dans un nouvel onglet", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }

  # Footer texts (content/footer.json). The office name, address and phone are fixed in _data/site.json.
  - name: footer
    label: "Pied de page"
    files:
      - name: footer
        label: "Pied de page"
        file: content/footer.json
        format: json
        description: "Le nom, l'adresse et le téléphone du bureau REMAX sont fixes (règles de la marque). Les coordonnées du courtier sont dans le Profil du courtier."
        fields:
          - name: office
            label: "Bureau"
            widget: object
            collapsed: false
            fields:
              - { name: type, label: "Type d'entreprise sous le nom du bureau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: phoneLabel, label: "Texte devant le numéro du bureau", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: licence
            label: "Permis de l'OACIQ"
            widget: object
            collapsed: false
