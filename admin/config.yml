                  - { name: maximumTooLow, label: "Erreur : maximum plus petit que le minimum", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
                  - { name: send, label: "Bouton Envoyer de la dernière étape", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          - name: propertyInfo
            label: "Plus d'infos sur une propriété (fenêtre des cartes de propriété)"
            widget: object
            collapsed: true
            fields:
              - { name: title, label: "Titre", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: emailSubject, label: "Objet du courriel reçu (sans JavaScript)", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: emailSubjectStart, label: "Début de l'objet du courriel reçu, suivi du numéro et du type de la propriété", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: name, label: "Champ Nom", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
              - { name: message, label: "Champ Message", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }

  # The agent's details (content/agent.json): one place, shown in the header, About, footer and forms.
  - name: agent
    label: "Profil du courtier"
    files:
      - name: profile
        label: "Profil du courtier"
        file: content/agent.json
        format: json
        description: "Les coordonnées du courtier, affichées à plusieurs endroits du site : modifiez-les ici une seule fois."
        fields:
          - { name: name, label: "Nom", widget: string }
          - { name: title, label: "Titre professionnel", widget: object, collapsed: false, fields: [{ name: fr, label: "Français", widget: string }, { name: en, label: "English", widget: string }] }
          # OACIQ licence: the footer shows it on every page once the number is filled in.
          - { name: licence, label: "Numéro de permis de l'OACIQ", widget: string, required: false, hint: "Affiché dans le pied de page dès qu'il est rempli." }
          - { name: licenceRegisterUrl, label: "Lien vers le registre de l'OACIQ", widget: string, required: false, pattern: ['^$|^https://(www\.)?oaciq\.com/', 'Doit être un lien oaciq.com'] }
          - { name: phone, label: "Cellulaire", widget: string, required: false }
          - { name: email, label: "Courriel", widget: string, required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Doit être une adresse courriel'] }
          # Social profiles: an icon shows on the site only when the link is filled in.
          - name: social
            label: "Réseaux sociaux"
            widget: object
            required: false
            hint: "Une icône s'affiche seulement quand le lien est rempli."
            fields:
              - { name: instagram, label: Instagram, widget: string, required: false, pattern: ['^$|^https://(www\.)?instagram\.com/', 'Doit être un lien instagram.com'] }
              - { name: facebook, label: Facebook, widget: string, required: false, pattern: ['^$|^https://(www\.)?facebook\.com/', 'Doit être un lien facebook.com'] }
          - { name: languages, label: "Langues parlées", widget: list, required: false }
          - { name: photo, label: "Photo (de secours)", widget: image, required: false, hint: "Utilisée seulement si la photo du bandeau de l'accueil est vide." }

  # b) Listings. Placeholder fields; adjust to the real site.
  - name: listings
    label: Listings
    label_singular: Listing
    folder: content/listings
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{status}}"
    sortable_fields: [published, title, price]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: address, label: Address, widget: string }
      - { name: neighbourhood, label: Neighbourhood, widget: string, required: false }
      - { name: price, label: Price, widget: number, value_type: int, min: 0 }
      - { name: bedrooms, label: Bedrooms, widget: number, value_type: int, min: 0, required: false }
      - { name: bathrooms, label: Bathrooms, widget: number, value_type: float, min: 0, step: 0.5, required: false }
      - { name: area, label: "Area (sq ft)", widget: number, value_type: int, min: 0, required: false }
      - { name: status, label: Status, widget: select, options: [available, under offer, sold, rented], default: available }
      - name: photos
        label: Photos
        widget: list
        required: false
        field: { name: image, label: Image, widget: image }
      - { name: published, label: Published date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: body, label: Description, widget: markdown, required: false }
