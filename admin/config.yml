# Decap CMS config. Served at https://mt81.github.io/ced/admin/
backend:
  name: turbo-github
  turbo_site_id: 22f1b961-cfd9-45c3-9abf-f120a44b4ac5
  branch: main
  # No `repo`: Turbo uses the repo set in the Turbo dashboard.

# Uploads are committed to /images/uploads. public_folder has no /ced prefix:
# the Eleventy build adds pathPrefix to every URL in the generated HTML.
media_folder: images/uploads
public_folder: /images/uploads

# Header + login logo. `logo` supersedes the deprecated `logo_url`; only `logo` can show in the header.
logo:
  src: /ced/images/logo.svg
  show_in_header: true
site_url: https://matteougolini.net/ced/
display_url: https://matteougolini.net/ced/

collections:
  # Home page hero (read by index.njk as `home`).
  - name: home
    label: Home page
    files:
      - name: hero
        label: Hero
        file: content/home.json
        format: json
        fields:
          - { name: initials, label: "Signature initials", widget: string, hint: "Shown large in the script font" }
          - { name: subtitle, label: Subtitle, widget: string }
          - { name: hero_image, label: "Main photo", widget: image }
          - { name: hero_image_alt, label: "Main photo description", widget: string, required: false }
          - { name: hero_image_secondary, label: "Side photo", widget: image, required: false }
          - { name: cta_label, label: "Contact button label", widget: string, default: "Contact me" }

  # a) Agent profile. Placeholder fields; adjust to the real site.
  - name: agent
    label: Agent profile
    files:
      - name: profile
        label: Profile
        file: content/agent.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: title, label: Title, widget: string, required: false }
          - { name: bio, label: Bio, widget: markdown, required: false }
          - { name: phone, label: Phone, widget: string, required: false }
          - { name: email, label: Email, widget: string, required: false, pattern: ['^[^@\s]+@[^@\s]+\.[^@\s]+$', 'Must be an email address'] }
          - { name: languages, label: Languages, widget: list, required: false }
          - { name: photo, label: Photo, widget: image, required: false }

  # b) Listings. Placeholder fields; adjust to the real site.
  - name: listings
    label: Listings
    label_singular: Listing
    folder: content/listings
    format: frontmatter
    extension: md
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{status}}"
    sortable_fields: [published, title, price]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: address, label: Address, widget: string }
      - { name: neighbourhood, label: Neighbourhood, widget: string, required: false }
      - { name: price, label: Price, widget: number, value_type: int, min: 0 }
      - { name: bedrooms, label: Bedrooms, widget: number, value_type: int, min: 0, required: false }
      - { name: bathrooms, label: Bathrooms, widget: number, value_type: float, min: 0, step: 0.5, required: false }
      - { name: area, label: "Area (sq ft)", widget: number, value_type: int, min: 0, required: false }
      - { name: status, label: Status, widget: select, options: [available, under offer, sold, rented], default: available }
      - name: photos
        label: Photos
        widget: list
        required: false
        field: { name: image, label: Image, widget: image }
      - { name: published, label: Published date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD }
      - { name: body, label: Description, widget: markdown, required: false }
