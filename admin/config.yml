                widget: object
                collapsed: false
                fields:
                  - { name: fr, label: "Français", widget: string }
                  - { name: en, label: "English", widget: string }
          - name: langSwitch
            label: "Sélecteur de langue"
            widget: object
            collapsed: true
            fields:
              - name: label
                label: "Nom du sélecteur de langue, lu par les lecteurs d'écran"
                widget: object
                collapsed: false
