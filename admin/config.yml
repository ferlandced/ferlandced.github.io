# Decap CMS config. Served at https://mt81.github.io/ced/admin/
backend:
  name: turbo-github
  turbo_site_id: 22f1b961-cfd9-45c3-9abf-f120a44b4ac5
  branch: main
  # No `repo`: Turbo uses the repo set in the Turbo dashboard.

# Uploads are committed to /images/uploads. public_folder has no /ced prefix:
# the Eleventy build adds pathPrefix to every URL in the generated HTML.
media_folder: images/uploads
public_folder: /images/uploads

# Header + login logo. `logo` supersedes the deprecated `logo_url`; only `logo` can show in the header.
logo:
  src: /ced/images/logo.svg
  show_in_header: true
site_url: https://matteougolini.net/ced/
display_url: https://matteougolini.net/ced/

collections:
  # Home page images (read by index.njk as `home`). Text lives in _data/i18n.json.
  - name: home
    label: Home page
    files:
      - name: hero
        label: Hero
        file: content/home.json
        format: json
        fields:
          - { name: signature, label: "Signature", widget: image, hint: "Agent mark (house + signature). SVG preferred, trimmed tight to the drawing." }
          - { name: hero_photo, label: "Agent photo", widget: image, hint: "Clipped photo with a transparent background, portrait, at least 1200 px tall. Also used in the About section." }
          - { name: hero_photo_alt, label: "Agent photo description", widget: string, required: false }
          - { name: side_image, label: "Side image", widget: image, required: false, hint: "Shown right of the red band on desktop only. Portrait, at least 1600 px tall, usage rights confirmed." }
          - { name: side_image_alt, label: "Side image description", widget: string, required: false, hint: "Leave empty if the image is decorative." }
          - { name: about_backdrop, label: "About backdrop", widget: image, required: false, hint: "Desktop only: the scene behind the agent photo in the About section. Portrait, same proportions as the agent photo. Empty shows a plain gray panel." }

  # Site copy (read by eleventy.config.js as `i18n`). Each text has a French and an English
  # version. Keys are fixed here, so editors can change the wording but not the structure.
  # Labels are the French description of where each text appears.
  - name: copy
    label: Textes du site
    files:
      - name: i18n
        label: Textes (français et anglais)
        file: content/i18n.json
        format: json
        fields:
          - name: nav
            label: "Menu"
            widget: object
            collapsed: true
            fields:
              - name: label
                label: "Nom du menu principal, lu par les lecteurs d'écran"
                widget: object
                collapsed: false
                fields:
                  - { name: fr, label: "Français", widget: string }
                  - { name: en, label: "English", widget: string }
              - name: home
                label: "Nom de la page d'accueil, lu par les lecteurs d'écran sur le logo"
                widget: object
                collapsed: false
                fields:
                  - { name: fr, label: "Français", widget: string }
                  - { name: en, label: "English", widget: string }
              - name: about
                label: "Lien du menu vers la section À propos"
                widget: object
                collapsed: false
                fields:
                  - { name: fr, label: "Français", widget: string }
                  - { name: en, label: "English", widget: string }
              - name: services
